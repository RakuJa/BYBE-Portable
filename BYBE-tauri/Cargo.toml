[package]
name = "BYBE-Portable"
version = "5.1.0"
authors = ["RakuJa"]

edition = "2024"
rust-version = "1.88.0"

description = "BYBE - Portable application for Desktop & Mobile"
readme = "../README.md"
homepage = "https://bybe.fly.dev/"
repository = "https://github.com/RakuJa/BYBE"
license = "MIT"
keywords = ["webservice", "pathfinder", "tauri", "desktop"]
publish = false

build = "build.rs"

[lints.rust]
unsafe_code = "forbid"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2.9.1"
# Both dialog and updater are used for handling automatic updates
tauri-plugin-updater = { version = "2.11", features = ["rustls-tls"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
# Lets the "hide the menu bar" toggle be reversed even while the menu is hidden
tauri-plugin-global-shortcut = "2.3"

# debug dependencies
# tauri-plugin-devtools = "2.0.1"

serde_json = "1.0"

anyhow = "1.0"

log = "0.4"

ctrlc = "3.5"

bybe-backend = {path = "../BYBE-backend" }
oneshot = "0.2.1"
tokio = "1.53"

[target.'cfg(windows)'.dependencies]
dunce = { version = "1.0.5"}
